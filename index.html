<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spine Surgery Weekly</title><link rel="stylesheet" href="styles.css"></head><body><div class="app-shell"><aside class="sidebar"><a class="brand" href="#"><span class="brand-icon">S+</span><span class="brand-name">Spine Research</span></a><nav class="side-nav"><button class="nav-link active" data-view="new">Przegląd literatury</button><button class="nav-link" data-view="journals">Czasopisma <span id="journalCount">0</span></button><button class="nav-link" data-view="read">Przeczytane <span id="readCount">0</span></button><button class="nav-link" data-view="saved">Do przeczytania <span id="savedCount">0</span></button><button class="nav-link" data-view="backup">Eksport i backup</button></nav></aside><main class="main"><header class="topbar"><span id="crumb">Przegląd literatury</span><span id="today"></span></header><div class="content"><section id="newView" class="view"><h1>Spine Surgery Weekly</h1><p>Najnowsze publikacje dotyczące chirurgii kręgosłupa.</p><section class="panel"><form id="searchForm"><label>Zakres<select name="days"><option value="7">7 dni</option><option value="14">14 dni</option><option value="30">30 dni</option></select></label><label>Liczba wyników<select name="limit"><option>20</option><option selected>40</option><option>60</option></select></label><label>Słowa kluczowe<input name="keywords" placeholder="np. stenosis"></label><div id="sources"></div><div id="presets"></div><label><input type="checkbox" name="openAccess"> Open Access</label><button id="searchBtn">Szukaj</button></form></section><div id="status">Wczytywanie…</div><div id="results"></div></section><section id="journalsView" class="view" hidden><h1>Wybór czasopism</h1><p>Wybierz czasopisma do monitorowania i kliknij „Zapisz wybór”.</p><input id="journalSearch" placeholder="Szukaj czasopisma"><div id="journalGroups" class="journal-groups"></div><button id="journalSelectAll">Zaznacz widoczne</button><button id="journalClear">Wyczyść zaznaczone</button><button id="applyJournals">Zapisz wybór i wyszukaj</button></section><section id="readView" class="view" hidden><h1>Przeczytane artykuły</h1><div id="readList"></div></section><section id="savedView" class="view" hidden><h1>Do przeczytania</h1><button id="exportBib">BibTeX</button><button id="exportCsv">CSV</button><div id="savedList"></div></section><section id="backupView" class="view" hidden><h1>Eksport i backup</h1><button id="backupExport">Pobierz JSON</button><input type="file" id="backupFile"><button id="backupMerge">Scal</button><button id="backupReplace">Zastąp</button><div id="backupMessage"></div></section></div></main></div><script src="app.js"></script></body></html>
